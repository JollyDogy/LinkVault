<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LinkVault — менеджер интернет-ссылок">
    <title>LinkVault — Менеджер ссылок</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <!-- шапка -->
     <header class="header">
        <div class="logo">
            <h1>LinkVault</h1>
        </div>
        <div class="header-actions">
            <button id="add-link-button" type="button">
                + Добавить ссылку
            </button>
        </div>
    </header>
    <!-- основная область -->
    <main class="main">
        <!-- боковая панель -->
        <aside class="sidebar">
            <h2>Библиотека</h2>
            <nav class="navigation">
                <button id="all-links-button" type="button">
                    Все ссылки
                </button>
                
                <button id="favorites-button" type="button">
                    Избранное
                </button>
            </nav>
            <div class="categories-section">
                <div class="categories-header">
                    <h3>Категории</h3>
                    <button id="add-category-button" type="button">
                        +
                    </button>
                </div>
                <div id="categories-list">
                </div>
            </div>
        </aside>
        <!-- основное содержимое -->
        <section class="content">
            <div class="content-header">
                <div>
                    <h2 id="page-title">Все ссылки</h2>
                    <p id="links-count">Сохранённые ссылки</p>
                </div>
                <div class="search">
                    <input
                    type="search"
                    id="search-input"
                    placeholder="Поиск ссылок..."
                    >
                </div>
            </div>
            <!-- список ссылок -->
            <div id="links-list">
            </div>
            <!-- сообщение при отсутствии ссылок -->
            <div id="empty-state" hidden>
                <h3>Здесь пока пусто</h3>
                <p>Добавьте свою первую ссылку в библиотеку.</p>
                <button id="empty-add-link-button" type="button">
                    Добавить ссылку
                </button>
            </div>
        </section>
    </main>
    <!-- окно добавления и редактирования ссылки -->
    <dialog id="link-dialog">
        <form id="link-form">
            <h2 id="dialog-title">Добавить ссылку</h2>
            <label for="link-title">Название</label>
            <input
            type="text"
            id="link-title"
            name="title"
            placeholder="Например, GitHub"
            required
            >
            <label for="link-url">Адрес сайта</label>
            <input
            type="url"
            id="link-url"
            name="url"
            placeholder="https://github.com"
            required
            >
            <label for="link-description">Описание</label>
            <textarea
            id="link-description"
            name="description"
            placeholder="Краткое описание ссылки..."
            >
            </textarea>
            <label for="link-category">Категория</label>
            <select id="link-category" name="categoryId">
                <option value="">Без категории</option>
            </select>
            <div class="dialog-actions">
                <button type="button" id="cancel-dialog-button">
                    Отмена
                </button>
                <button type="submit" id="save-link-button">
                    Сохранить
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
